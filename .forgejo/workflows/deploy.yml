name: Build and deploy CDTank

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cdtank-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: cdtank-deploy
    timeout-minutes: 90
    env:
      CDTANK_IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install release assets
        run: node scripts/install-assets.mjs

      - name: Import assets image
        run: bash deployment/import-assets.sh "cdtank-assets:${CDTANK_IMAGE_TAG}"

      - name: Build image
        run: >-
          docker build
          --build-arg "CDTANK_ASSETS_IMAGE=cdtank-assets:${CDTANK_IMAGE_TAG}"
          --tag "cdtank:${CDTANK_IMAGE_TAG}" --tag cdtank:latest .

      - name: Deploy
        run: docker compose -f deployment/compose.yml up --detach --wait --wait-timeout 180

      - name: Deployment URL
        run: echo 'CDTank is available at https://tank.cloyd.fun/'
